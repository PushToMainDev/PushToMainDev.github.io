<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Push To Main Dev</title>
<script>
  // Older Kin Kitchen links used /kinkitchen/recipe/<id> (or post, chef).
  // Send them to the current form, /kinkitchen/?recipe=<id>.
  var parts = location.pathname.split('/').filter(Boolean);
  if (parts[0] === 'kinkitchen' && ['recipe', 'post', 'chef'].indexOf(parts[1]) !== -1 && parts[2]) {
    location.replace('/kinkitchen/?' + parts[1] + '=' + encodeURIComponent(parts[2]));
  }
</script>
<link rel="icon" href="/assets/img/favicon.ico">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
